services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carbargains}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: ${POSTGRES_DB:-carbargains}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_CV: ${INSTALL_CV:-false}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-carbargains}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-carbargains}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); data=json.load(r); assert data.get('database') == 'ok' and data.get('redis') == 'ok'\""]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    volumes:
      - rawdata:/app/raw
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_CV: ${INSTALL_CV:-false}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-carbargains}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-carbargains}
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "--pool=solo", "--concurrency=1"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - rawdata:/app/raw
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_CV: ${INSTALL_CV:-false}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-carbargains}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-carbargains}
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "workers.celery_app", "beat", "--loglevel=info", "--schedule=/var/lib/celery/beat-schedule"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - beatdata:/var/lib/celery
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN:?APP_DOMAIN es obligatorio}
    environment:
      NEXT_PUBLIC_API_URL: https://${APP_DOMAIN:?APP_DOMAIN es obligatorio}
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN es obligatorio}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rawdata:
  beatdata:
  caddy_data:
  caddy_config:
