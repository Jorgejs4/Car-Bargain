name: Mantenimiento valoración

# PAUSADO temporalmente mientras Neon recupera la cuota de transferencia.
# Para reactivarlo, restaurar los triggers workflow_dispatch y schedule.
on: []

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encolar valoración e importación
        env:
          API_URL: ${{ secrets.CARBARGAINS_API_URL }}
          INTERNAL_KEY: ${{ secrets.CARBARGAINS_INTERNAL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_URL"
          test -n "$INTERNAL_KEY"
          echo "Comprobando disponibilidad de la API..."
          for attempt in $(seq 1 60); do
            if health=$(curl --location --silent --show-error --fail-with-body \
              --connect-timeout 10 --max-time 20 "$API_URL/health"); then
              echo "$health" | jq .
              if echo "$health" | jq -e '.database == "ok" and .redis == "ok"' >/dev/null; then
                break
              fi
            fi
            if [ "$attempt" = "60" ]; then
              echo "La API no está saludable tras 10 minutos; no se ejecuta mantenimiento."
              exit 1
            fi
            sleep 10
          done
          for task in score import cross-border alerts; do
            curl --location --fail-with-body --silent --show-error \
              --connect-timeout 15 --max-time 120 --retry-all-errors --retry 6 --retry-delay 10 \
              -X POST "$API_URL/internal/maintenance/$task" \
              -H "X-Internal-Key: $INTERNAL_KEY"
            echo
          done
