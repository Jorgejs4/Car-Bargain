name: Trigger scrapers production

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  trigger:
    runs-on: ubuntu-latest
    # Un único worker procesa también imágenes y enriquecimiento de texto.
    # No iniciar otra tanda mientras la anterior sigue esperando al worker.
    concurrency:
      group: production-scrapers
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - name: Lanzar scrapers en la API de producción
        env:
          API_URL: ${{ secrets.CARBARGAINS_API_URL }}
          INTERNAL_KEY: ${{ secrets.CARBARGAINS_INTERNAL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_URL"
          test -n "$INTERNAL_KEY"
          overall_failed=0
          for source in autoscout24 coches-net mobile-de; do
            pages=6
            if [ "$source" = "mobile-de" ]; then pages=3; fi
            response_file=$(mktemp)
            if ! http_code=$(curl --location --post301 --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
              -X POST "$API_URL/internal/scrapers/$source" \
              -H "X-Internal-Key: $INTERNAL_KEY" \
              -H "Content-Type: application/json" \
              --data "{\"max_pages\":${pages},\"save_raw_response\":true,\"enqueue_image_downloads\":true}" \
              -o "$response_file" -w '%{http_code}'); then
              echo "[$source] error al llamar al endpoint: $(cat "$response_file")"
              overall_failed=1
              rm -f "$response_file"
              continue
            fi
            response=$(cat "$response_file")
            echo "[$source] HTTP $http_code"
            echo "[$source] respuesta de disparo: $response"
            rm -f "$response_file"
            if [ "$http_code" != "200" ]; then
              echo "[$source] la API no devolvió HTTP 200"
              overall_failed=1
              continue
            fi
            if ! echo "$response" | jq -e . >/dev/null 2>&1; then
              echo "[$source] la API no devolvió JSON válido"
              overall_failed=1
              continue
            fi
            task_id=$(echo "$response" | jq -r '.task_id // empty')
            if [ -z "$task_id" ]; then
              echo "[$source] la API no devolvió task_id"
              overall_failed=1
              continue
            fi
            echo "[$source] tarea encolada: $task_id (max_pages=$pages)"
            source_failed=0
            state=""
            # Hasta 30 minutos por fuente: PENDING significa que Celery aún
            # no la ha tomado, no que el scraper haya fallado.
            for attempt in $(seq 1 360); do
              if ! status=$(curl --location --fail-with-body --silent --show-error \
                -H "X-Internal-Key: $INTERNAL_KEY" "$API_URL/internal/tasks/$task_id"); then
                echo "[$source] no se pudo consultar el estado de la tarea"
                source_failed=1
                break
              fi
              state=$(echo "$status" | jq -r .status)
              if [ "$state" = "SUCCESS" ]; then
                echo "[$source] resumen:"
                echo "$status" | jq '.result | {source, listings, listings_created, repeated, listings_updated, snapshots_appended, duration_ms}'
                break
              fi
              if [ "$state" = "FAILURE" ]; then
                echo "$status" | jq .
                source_failed=1
                break
              fi
              sleep 5
            done
            if [ "$state" != "SUCCESS" ]; then
              echo "[$source] timeout esperando resultado (estado=$state)"
              source_failed=1
            fi
            if [ "$source_failed" -ne 0 ]; then
              overall_failed=1
            fi
          done
          exit "$overall_failed"
